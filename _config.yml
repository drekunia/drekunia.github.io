# Author info
author:
  name: "drekunia"
  title: "ドレクニア"
  bio:
    en: |
      I usually spend my time doing things I enjoy and looking into whatever catches my interest.
      I'm interested in way too many things, so I'm always dabbling in a bit of everything.

      If you have some time, feel free to [check out my blog](https://drekunia.github.io/blog).
    ja: |
      普段は好きなことをしたり、気になったことを調べたりして過ごしてます。
      興味のあることが多すぎて、いつもあれこれ手を出してます。

      暇だったら、[ブログでも覗いてみてください](https://drekunia.github.io/blog)。
    id: |
      Aku sering ngabisin waktu buat hal-hal yang aku suka atau cari tahu soal apa aja yang bikin penasaran. Saking banyaknya yang menarik, aku jadi sering nyobain macam-macam hal.

      Kalau lagi senggang, [mampir ke blogku](https://drekunia.github.io/blog) juga, ya.
  avatar: "/assets/img/avatar.webp"

